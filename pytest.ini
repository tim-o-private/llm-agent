[pytest]
pythonpath = . src
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    asyncio: mark test as async
    integration: mark test as requiring live database/services (deselected by default)
    sandbox: mark test as requiring bwrap sandbox (deselected by default, use --run-sandbox)

[pytest-cov]
source = src

