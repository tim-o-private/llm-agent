# Ruff configuration for llm-agent Python code
target-version = "py312"
line-length = 120
exclude = [
    ".venv",
    ".archive",
    "node_modules",
    "build",
    "dist",
]

[lint]
select = ["E", "F", "W", "I"]  # pycodestyle errors/warnings, pyflakes, isort

[lint.per-file-ignores]
# Template files contain long lines inside multi-line strings (workflow markdown)
"chatServer/workflows/templates/*.py" = ["E501"]

[lint.isort]
known-first-party = ["chatServer", "src"]
